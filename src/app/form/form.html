<h2 class="text-2xl font-bold text-center text-gray-800 mb-6">
    User Form
</h2>

@if (form$ | async; as form) {
<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
        <!-- Name -->
        <div class="mb-5">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Name
            </label>
            <input #nameInput type="text" placeholder="Enter your name" [value]="form.name"
                (input)="updatedField('name', nameInput.value)"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
        </div>

        <!-- Email -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                Email
            </label>
            <input #emailInput type="email" placeholder="Enter your email" [value]="form.email"
                (input)="updatedField('email', emailInput.value)"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
        </div>

        <!-- Buttons -->
        <div class="flex gap-3">
            <button
                class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition duration-200">
                Save
            </button>

            <button (click)="resetForm()"
                class="flex-1 bg-red-500 text-white py-3 rounded-lg font-medium hover:bg-red-600 transition duration-200">
                Reset
            </button>
        </div>
    </div>

    <div>
        <h4>Preview Form </h4>
        <pre>{{ form | json }}</pre>
    </div>
</div>
}
